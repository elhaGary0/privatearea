<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lumière — دخول خاص</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <style>
        :root{
            --ivory:#FBF5F1;
            --rose:#B0697A;
            --rose-deep:#8C4C5C;
            --plum:#33212A;
            --gold:#C9A15A;
            --blush:#F4E3E1;
            --line:#E7D3CE;
        }
        * { font-family: 'Tajawal', sans-serif; }
        .font-display { font-family: 'Cormorant Garamond', serif; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(140, 76, 92, 0.55); }
            70% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(140, 76, 92, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(140, 76, 92, 0); }
        }
        .recording { animation: pulse-red 1.5s infinite; background-color: var(--rose-deep) !important; color: white; }

        .petal-divider { height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

        .luxe-input {
            background: transparent;
            border-bottom: 1px solid var(--line);
            transition: border-color .25s ease;
        }
        .luxe-input:focus { border-color: var(--rose-deep); }

        .luxe-btn {
            background: linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 100%);
        }
        .luxe-btn:active { transform: scale(0.98); }

        .chat-bg {
            background-color: var(--ivory);
            background-image: radial-gradient(circle at 1px 1px, rgba(176,105,122,0.10) 1px, transparent 0);
            background-size: 22px 22px;
        }
    </style>
</head>
<body class="bg-[#221219] h-[100dvh] w-screen overflow-hidden text-[var(--plum)] selection:bg-[var(--rose)] selection:text-white">

    <!-- شاشة الدخول -->
    <div id="loginScreen" class="flex flex-col items-center justify-center h-full w-full absolute z-50 bg-[var(--plum)] transition-opacity duration-500 p-6 safe-top safe-bottom">
        <div class="absolute inset-0 opacity-[0.5]" style="background: radial-gradient(circle at 50% 0%, rgba(176,105,122,0.35), transparent 60%);"></div>

        <div class="relative w-full max-w-sm bg-[var(--ivory)] p-8 sm:p-10 rounded-[28px] shadow-2xl">
            <div class="flex flex-col items-center mb-8 text-center">
                <svg class="w-10 h-10 text-[var(--rose-deep)] mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c1.8 2.6 2.7 4.9 2.7 6.8 0 2.4-1.6 4.2-2.7 5.2-1.1-1-2.7-2.8-2.7-5.2 0-1.9.9-4.2 2.7-6.8z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v6M8.5 21h7"></path>
                </svg>
                <h2 class="font-display italic text-3xl text-[var(--plum)] tracking-wide">Lumière</h2>
                <p class="text-[11px] text-[var(--rose-deep)] tracking-[0.25em] mt-2 uppercase">دخول خاص للأعضاء</p>
            </div>

            <div class="petal-divider mb-8"></div>

            <div id="errorMessage" class="hidden mb-5 p-3 bg-[var(--blush)] border border-[var(--rose)]/40 text-[var(--rose-deep)] rounded-xl text-xs text-center"></div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-[11px] text-[var(--rose-deep)]/80 mb-1.5 tracking-wide">اسم المستخدم</label>
                    <input type="text" id="usernameInput" class="luxe-input w-full px-1 py-2.5 text-[var(--plum)] outline-none text-sm" placeholder="اسمك" required autocomplete="off">
                </div>
                <div>
                    <label class="block text-[11px] text-[var(--rose-deep)]/80 mb-1.5 tracking-wide">كلمة المرور</label>
                    <input type="password" id="passwordInput" class="luxe-input w-full px-1 py-2.5 text-[var(--plum)] outline-none text-sm" placeholder="••••••••" required>
                </div>
                <button type="submit" class="luxe-btn w-full text-white text-sm font-bold py-3.5 px-4 rounded-full shadow-lg shadow-[var(--rose)]/30 hover:shadow-xl transition-all mt-2">
                    دخول
                </button>
            </form>
        </div>

        <p class="relative text-[10px] text-[var(--ivory)]/40 mt-8 tracking-widest">LUMIÈRE PRIVATE ACCESS</p>
    </div>

    <!-- شاشة المحادثة -->
    <div id="chatScreen" class="hidden flex-col h-[100dvh] w-full max-w-2xl mx-auto bg-[var(--ivory)] relative shadow-2xl overflow-hidden">
        <!-- الهيدر -->
        <div class="bg-gradient-to-l from-[var(--rose-deep)] to-[var(--rose)] px-4 py-3 flex items-center justify-between shadow-md z-20 text-white shrink-0 safe-top">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center text-white overflow-hidden ring-1 ring-white/30">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c1.8 2.6 2.7 4.9 2.7 6.8 0 2.4-1.6 4.2-2.7 5.2-1.1-1-2.7-2.8-2.7-5.2 0-1.9.9-4.2 2.7-6.8z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v6M8.5 21h7"></path>
                    </svg>
                </div>
                <div class="flex flex-col">
                    <h1 class="font-display italic font-semibold text-[19px] leading-tight" id="chatTitle">الدردشة الخاصة</h1>
                    <p class="text-[12px] text-white/80" id="statusText">جاري الاتصال...</p>
                </div>
            </div>
            <div class="flex gap-4">
                <button id="logoutBtn" class="text-white/80 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </div>

        <div class="absolute inset-0 z-0 chat-bg pointer-events-none"></div>

        <!-- منطقة الرسائل -->
        <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar z-10 relative scroll-smooth">
        </div>

        <!-- لوحة الإيموجي -->
        <div id="emojiPanel" class="hidden w-full bg-[var(--blush)] border-t border-[var(--line)] p-2 z-10 transition-all shadow-lg h-64 flex-col shrink-0">
            <div class="grid grid-cols-7 sm:grid-cols-10 gap-2 overflow-y-auto no-scrollbar p-1 pb-4" id="emojiGrid"></div>
        </div>

        <!-- شريط الإدخال -->
        <div class="bg-[var(--blush)] p-2 w-full z-20 shrink-0 relative safe-bottom">
            <div id="uploadProgress" class="hidden w-full bg-[var(--line)] rounded-full h-1 mb-2">
                <div id="progressBar" class="bg-[var(--rose-deep)] h-1 rounded-full w-0 transition-all duration-300"></div>
            </div>

            <form id="messageForm" class="flex items-end gap-2">
                <button type="button" id="emojiBtn" class="p-3 text-[var(--rose-deep)]/70 hover:text-[var(--rose-deep)] transition-colors shrink-0">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </button>
                
                <button type="button" id="attachBtn" class="p-3 text-[var(--rose-deep)]/70 hover:text-[var(--rose-deep)] transition-colors relative shrink-0">
                    <svg class="w-6 h-6 transform -rotate-45" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                    <!-- رفع الصور فقط لتقليل الحجم -->
                    <input type="file" id="fileInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                </button>
                
                <div class="flex-1 bg-white rounded-3xl flex items-center min-h-[44px] shadow-sm px-2 ring-1 ring-[var(--line)]">
                    <textarea id="messageInput" class="w-full bg-transparent resize-none px-2 py-3 focus:outline-none text-[15px] max-h-24 no-scrollbar text-[var(--plum)]" placeholder="المراسلة..." rows="1" dir="auto"></textarea>
                </div>
                
                <div class="flex items-center justify-center w-12 h-12 shrink-0">
                    <button type="submit" id="sendBtn" class="hidden w-11 h-11 luxe-btn text-white rounded-full flex items-center justify-center shadow-md transition-transform active:scale-95">
                        <svg class="w-5 h-5 rtl:-scale-x-100 mr-1" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                    </button>
                    
                    <button type="button" id="micBtn" class="w-11 h-11 luxe-btn text-white rounded-full flex items-center justify-center shadow-md transition-all active:scale-95">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"></path></svg>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        const APP_PASSWORD = "110"; 

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
        // تم إزالة مكتبة Storage نهائياً - التطبيق يعتمد على Firestore المجانية بالكامل

        const firebaseConfig = {
            apiKey: "AIzaSyDPb9Do2T5rBkuGWEYecHrnFG3ePcxWln8",
            authDomain: "myprivatechat-6b6b6.firebaseapp.com",
            projectId: "myprivatechat-6b6b6",
            storageBucket: "myprivatechat-6b6b6.firebasestorage.app",
            messagingSenderId: "717975093359",
            appId: "1:717975093359:web:e4435d2751f4c4465f4d9a",
            measurementId: "G-DWDZQ332VS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const messagesRef = collection(db, "messages");
        const presenceRef = collection(db, "presence");

        let currentUser = "";
        let otherUser = "";
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const els = {
            loginScreen: document.getElementById('loginScreen'),
            chatScreen: document.getElementById('chatScreen'),
            loginForm: document.getElementById('loginForm'),
            usernameInput: document.getElementById('usernameInput'),
            passwordInput: document.getElementById('passwordInput'),
            errorMsg: document.getElementById('errorMessage'),
            msgContainer: document.getElementById('messagesContainer'),
            msgForm: document.getElementById('messageForm'),
            msgInput: document.getElementById('messageInput'),
            sendBtn: document.getElementById('sendBtn'),
            micBtn: document.getElementById('micBtn'),
            attachBtn: document.getElementById('attachBtn'),
            fileInput: document.getElementById('fileInput'),
            emojiBtn: document.getElementById('emojiBtn'),
            emojiPanel: document.getElementById('emojiPanel'),
            emojiGrid: document.getElementById('emojiGrid'),
            statusText: document.getElementById('statusText'),
            progressBox: document.getElementById('uploadProgress'),
            progressBar: document.getElementById('progressBar')
        };

        const EMOJI_LIST = ['😀','😃','😄','😁','😆','😅','😂','🤣','🥲','☺️','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😙','😚','😋','😛','😝','😜','🤪','🤨','🧐','🤓','😎','🥸','🤩','🥳','😏','😒','😞','😔','😟','😕','🙁','☹️','😣','😖','😫','😩','🥺','😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥','😓','🤗','🤔','🤭','🤫','🤥','😶','😐','😑','😬','🙄','😯','😦','😧','😮','😲','🥱','😴','🤤','😪','😵','🤐','🥴','🤢','🤮','🤧','😷','🤒','🤕','🤑','🤠','😈','👿','👹','👺','🤡','💩','👻','💀','☠️','👽','👾','🤖','🎃','😺','😸','😹','😻','😼','😽','🙀','😿','😾','❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❤️‍🔥','❤️‍🩹','❣️','💕','💞','💓','💗','💖','💘','💝','👍','👎','👏','🙌','👐','🤲','🤝','🤜','🤛','✊','👊','🖐️','✋','🤚','👋','🤏','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','🖕','👇','☝️','💪','🦾','🦵','🦿','🦶','👣'];

        EMOJI_LIST.forEach(emoji => {
            const span = document.createElement('span');
            span.className = 'text-2xl cursor-pointer hover:bg-[#F4E3E1] p-1 rounded-lg text-center transition-colors';
            span.textContent = emoji;
            span.onclick = () => { els.msgInput.value += emoji; toggleSendMicBtn(); els.msgInput.focus(); };
            els.emojiGrid.appendChild(span);
        });

        els.loginForm.onsubmit = (e) => {
            e.preventDefault();
            const name = els.usernameInput.value.trim();
            const pass = els.passwordInput.value;

            if (pass === APP_PASSWORD && name !== "") {
                currentUser = name;
                els.loginScreen.classList.add('opacity-0');
                setTimeout(() => {
                    els.loginScreen.classList.add('hidden');
                    els.chatScreen.classList.remove('hidden');
                    els.chatScreen.classList.add('flex');
                    initChat();
                }, 500);
            } else {
                els.errorMsg.textContent = "بيانات الدخول غير صحيحة، حاول مرة أخرى";
                els.errorMsg.classList.remove('hidden');
            }
        };

        document.getElementById('logoutBtn').onclick = () => location.reload();

        function initChat() {
            updatePresence();
            setInterval(updatePresence, 60000);
            
            onSnapshot(collection(db, "presence"), (snapshot) => {
                snapshot.forEach(doc => {
                    if(doc.id !== currentUser) {
                        otherUser = doc.id;
                        const data = doc.data();
                        const lastSeen = data.lastSeen ? data.lastSeen.toDate() : new Date();
                        const diffMins = Math.floor((new Date() - lastSeen) / 60000);
                        
                        if(diffMins < 2) {
                            els.statusText.textContent = "متصل الآن";
                            els.statusText.className = "text-[12px] text-green-300";
                        } else {
                            els.statusText.textContent = `آخر ظهور منذ ${diffMins} دقيقة`;
                            els.statusText.className = "text-[12px] text-gray-200";
                        }
                    }
                });
            });

            loadMessages();
        }

        async function updatePresence() {
            if(currentUser) {
                await setDoc(doc(db, "presence", currentUser), { lastSeen: serverTimestamp() });
            }
        }

        function loadMessages() {
            const q = query(messagesRef, orderBy("timestamp", "asc"));
            onSnapshot(q, (snapshot) => {
                els.msgContainer.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    if (msg.type === "system") return;
                    if (msg.sender !== currentUser && !msg.seen) {
                        updateDoc(doc(db, "messages", docSnap.id), { seen: true });
                    }
                    renderMessage(msg, msg.sender === currentUser);
                });
                els.msgContainer.scrollTo(0, els.msgContainer.scrollHeight);
            });
        }

        function renderMessage(msg, isMe) {
            const timeString = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '';
            let seenStatus = isMe ? (msg.seen ? `<svg class="w-4 h-4 text-[#8C4C5C] inline ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM.41 13.41L6 19l1.41-1.41L1.83 12 .41 13.41z"></path></svg>` : `<svg class="w-4 h-4 text-gray-400 inline ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"></path></svg>`) : '';

            let contentHTML = '';
            if (msg.type === 'text') {
                contentHTML = `<p class="break-words text-[15px] leading-relaxed whitespace-pre-wrap">${escapeHTML(msg.text)}</p>`;
            } else if (msg.type === 'image') {
                contentHTML = `<img src="${msg.url}" class="rounded-lg max-w-full h-auto mb-1 cursor-pointer" onclick="window.open('${msg.url}')">`;
                if(msg.text) contentHTML += `<p class="text-sm mt-1">${escapeHTML(msg.text)}</p>`;
            } else if (msg.type === 'audio') {
                contentHTML = `<audio src="${msg.url}" controls class="w-48 h-10"></audio>`;
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex w-full mb-1 ${isMe ? 'justify-end' : 'justify-start'}`;
            const bubbleStyle = isMe ? 'bg-[#F4E3E1] text-[#33212A] rounded-2xl rounded-tr-md shadow-sm ring-1 ring-[#E7D3CE]' : 'bg-white text-[#33212A] rounded-2xl rounded-tl-md shadow-sm ring-1 ring-[#E7D3CE]';
            
            msgDiv.innerHTML = `
                <div class="max-w-[85%] relative px-2.5 pt-2 pb-1.5 ${bubbleStyle}">
                    ${contentHTML}
                    <div class="flex items-center justify-end gap-1 mt-1">
                        <span class="text-[11px] text-gray-500">${timeString}</span>
                        ${seenStatus}
                    </div>
                </div>`;
            els.msgContainer.appendChild(msgDiv);
        }

        els.msgInput.addEventListener('input', () => {
            els.msgInput.style.height = 'auto';
            els.msgInput.style.height = (els.msgInput.scrollHeight) + 'px';
            toggleSendMicBtn();
        });

        els.msgInput.addEventListener('focus', () => {
            setTimeout(() => els.msgContainer.scrollTo({ top: els.msgContainer.scrollHeight, behavior: 'smooth' }), 300);
        });

        function toggleSendMicBtn() {
            if (els.msgInput.value.trim().length > 0) {
                els.micBtn.classList.add('hidden');
                els.sendBtn.classList.remove('hidden');
            } else {
                els.micBtn.classList.remove('hidden');
                els.sendBtn.classList.add('hidden');
            }
        }

        els.msgForm.onsubmit = async (e) => {
            e.preventDefault();
            const text = els.msgInput.value.trim();
            if (!text) return;
            els.msgInput.value = '';
            els.msgInput.style.height = 'auto';
            toggleSendMicBtn();
            els.emojiPanel.classList.add('hidden');
            await sendMessage({ type: 'text', text: text });
        };

        async function sendMessage(data) {
            try {
                await addDoc(messagesRef, { ...data, sender: currentUser, timestamp: Date.now(), seen: false });
                updatePresence();
            } catch (err) {
                alert("الملف كبير جداً أو حدث خطأ في الإرسال");
                console.error(err);
            }
        }

        // ==========================================
        // تقنية تحويل الصور والصوت إلى نصوص (مجاني 100%)
        // ==========================================
        els.fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            els.progressBox.classList.remove('hidden');
            els.progressBar.style.width = '50%';
            
            // ضغط الصورة وتحويلها
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600; // تصغير المقاس لتقليل الحجم
                    const MAX_HEIGHT = 600;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // ضغط جودة الصورة إلى 50% لتناسب السيرفر المجاني
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.5); 
                    
                    els.progressBar.style.width = '100%';
                    setTimeout(() => els.progressBox.classList.add('hidden'), 500);
                    
                    let caption = els.msgInput.value.trim();
                    els.msgInput.value = '';
                    toggleSendMicBtn();
                    
                    await sendMessage({ type: 'image', url: compressedBase64, text: caption });
                }
            };
        };

        els.micBtn.onclick = async () => {
            if (isRecording) {
                mediaRecorder.stop();
                els.micBtn.classList.remove('recording');
                isRecording = false;
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    // تحديد صيغة الصوت المناسبة للهاتف (لحل مشكلة الآيفون والـ 0 ثانية)
                    let options = {};
                    if (MediaRecorder.isTypeSupported('audio/mp4')) {
                        options = { mimeType: 'audio/mp4' };
                    } else if (MediaRecorder.isTypeSupported('audio/webm')) {
                        options = { mimeType: 'audio/webm' };
                    }

                    mediaRecorder = new MediaRecorder(stream, options);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => {
                        if (e.data.size > 0) {
                            audioChunks.push(e.data);
                        }
                    };
                    
                    mediaRecorder.onstop = async () => {
                        // إعطاء الصوت صيغة واضحة لكي يفهمها المتصفح عند التشغيل
                        const audioType = mediaRecorder.mimeType || 'audio/webm';
                        const audioBlob = new Blob(audioChunks, { type: audioType });
                        
                        stream.getTracks().forEach(track => track.stop());
                        
                        els.progressBox.classList.remove('hidden');
                        els.progressBar.style.width = '60%';
                        
                        // تحويل الصوت إلى نص (Base64)
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = async () => {
                            els.progressBar.style.width = '100%';
                            setTimeout(() => els.progressBox.classList.add('hidden'), 500);
                            await sendMessage({ type: 'audio', url: reader.result });
                        }
                    };
                    
                    // (200) تجبر الهاتف على تجميع وتخزين الصوت بانتظام أثناء التحدث
                    mediaRecorder.start(200); 
                    els.micBtn.classList.add('recording');
                    isRecording = true;
                } catch (err) {
                    alert("الرجاء السماح بصلاحية الميكروفون للموقع");
                }
            }
        };

        els.emojiBtn.onclick = () => { els.emojiPanel.classList.toggle('hidden'); };
        function escapeHTML(str) { return !str ? '' : str.replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag])); }
    </script>
</body>
</html>
