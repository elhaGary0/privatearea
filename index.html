<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محادثة خاصة</title>
    <!-- استدعاء Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* إخفاء شريط التمرير مع الاحتفاظ بالوظيفة */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-gray-100 h-screen overflow-hidden selection:bg-blue-200">

    <div id="loginScreen" class="flex items-center justify-center h-full w-full p-4 absolute z-50 bg-gray-100 transition-opacity duration-300">
        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm">
            <div class="flex justify-center mb-6">
                <div class="bg-blue-100 p-4 rounded-full">
                    <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
            </div>
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">الدخول السري</h2>
            
            <div id="errorMessage" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-xl text-sm text-center"></div>
            
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">اسمك</label>
                    <input type="text" id="usernameInput" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all" placeholder="اكتب اسمك هنا" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
                    <input type="password" id="passwordInput" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all" placeholder="كلمة المرور المشتركة" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-lg shadow-blue-200 mt-4">
                    دخول للمحادثة
                </button>
            </form>
        </div>
    </div>

    <div id="chatScreen" class="hidden flex-col h-full max-w-md mx-auto bg-gray-50 sm:shadow-2xl relative">
        <!-- Header -->
        <div class="bg-white px-4 py-4 flex items-center justify-between shadow-sm z-20">
            <div class="flex items-center gap-3">
                <div id="userAvatar" class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-blue-400 rounded-full flex items-center justify-center text-white font-bold shadow-md">
                    م
                </div>
                <div>
                    <h1 class="font-bold text-gray-800 text-lg">الدردشة الخاصة</h1>
                    <p class="text-xs text-green-500 font-medium flex items-center gap-1">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> متصل
                    </p>
                </div>
            </div>
            <button id="logoutBtn" class="text-gray-400 hover:text-red-500 transition-colors p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
        </div>

        <!-- Messages Area -->
        <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar pb-20">
            <div class="text-center text-gray-400 mt-10 text-sm">
                جاري تحميل الرسائل...
            </div>
        </div>

        <!-- Emoji Panel -->
        <div id="emojiPanel" class="hidden absolute bottom-[72px] left-0 w-full bg-white border-t border-gray-100 p-4 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-10 transition-transform duration-300">
            <div class="grid grid-cols-6 gap-3 max-h-40 overflow-y-auto no-scrollbar" id="emojiGrid">
                <!-- Emojis will be injected here via JS -->
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white border-t border-gray-100 p-3 absolute bottom-0 w-full z-20">
            <form id="messageForm" class="flex items-center gap-2">
                <button type="button" id="emojiBtn" class="p-2 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </button>
                
                <input type="text" id="messageInput" class="flex-1 bg-gray-100 rounded-full px-5 py-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all text-sm" placeholder="اكتب رسالتك..." autocomplete="off">
                
                <button type="submit" id="sendBtn" class="w-11 h-11 flex items-center justify-center bg-blue-600 text-white rounded-full hover:bg-blue-700 transition-colors shadow-md disabled:opacity-50" disabled>
                    <svg class="w-5 h-5 rtl:rotate-180 -ml-1 rtl:ml-0 rtl:-mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        // =========================================================================
        // 1. إعدادات التطبيق الأساسية (قم بتغيير كلمة المرور من هنا)
        // =========================================================================
        const APP_PASSWORD = "123"; // 🔴 ضع الباسورد الذي تريده هنا

        // =========================================================================
        // 2. استدعاء مكتبات Firebase
        // =========================================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // =========================================================================
        // 3. إعدادات Firebase الخاصة بك (ستحصل عليها من موقع Firebase)
        // =========================================================================
        // 🔴 استبدل القيم الموجودة بين الأقواس ببيانات مشروعك الحقيقية لاحقاً
        const isPreview = typeof window.__firebase_config !== 'undefined';
      const firebaseConfig = {
  apiKey: "AIzaSyDPb9Do2T5rBkuGWEYecHrnFG3ePcxWln8",
  authDomain: "myprivatechat-6b6b6.firebaseapp.com",
  projectId: "myprivatechat-6b6b6",
  storageBucket: "myprivatechat-6b6b6.firebasestorage.app",
  messagingSenderId: "717975093359",
  appId: "1:717975093359:web:e4435d2751f4c4465f4d9a",
  measurementId: "G-DWDZQ332VS"
};

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // تحديد مسار حفظ الرسائل
        const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'my-private-chat';
        const messagesRef = isPreview 
            ? collection(db, 'artifacts', appId, 'public', 'data', 'messages') 
            : collection(db, "messages"); // المسار الفعلي على موقعك

        // =========================================================================
        // 4. متغيرات الواجهة وحالة التطبيق
        // =========================================================================
        let currentUser = "";
        
        const loginScreen = document.getElementById('loginScreen');
        const chatScreen = document.getElementById('chatScreen');
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const errorMessage = document.getElementById('errorMessage');
        const userAvatar = document.getElementById('userAvatar');
        
        const messagesContainer = document.getElementById('messagesContainer');
        const messageForm = document.getElementById('messageForm');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        
        const emojiBtn = document.getElementById('emojiBtn');
        const emojiPanel = document.getElementById('emojiPanel');
        const emojiGrid = document.getElementById('emojiGrid');

        // قائمة الإيموجي
        const EMOJIS = ['😀','😂','🥰','😎','🥺','😭','😡','👍','❤️','🔥','✨','🎉','🙏','👀','💯','💡','🤦‍♂️','🤷‍♂️'];

        // =========================================================================
        // 5. وظائف تسجيل الدخول والخروج
        // =========================================================================
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = usernameInput.value.trim();
            const pass = passwordInput.value;

            if (pass === APP_PASSWORD && name !== "") {
                currentUser = name;
                userAvatar.textContent = name.charAt(0).toUpperCase();
                loginScreen.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    loginScreen.classList.add('hidden');
                    chatScreen.classList.remove('hidden');
                    chatScreen.classList.add('flex');
                    loadMessages(); // بدء جلب الرسائل
                }, 300);
            } else {
                errorMessage.textContent = "كلمة المرور خاطئة!";
                errorMessage.classList.remove('hidden');
            }
        });

        logoutBtn.addEventListener('click', () => {
            location.reload(); // إعادة تحميل الصفحة للخروج
        });

        // =========================================================================
        // 6. وظائف الدردشة وإرسال الرسائل (Firebase)
        // =========================================================================
        let unsubscribe = null;

        function loadMessages() {
            // جلب الرسائل وترتيبها حسب الوقت
            const q = query(messagesRef, orderBy("timestamp", "asc"));
            
            unsubscribe = onSnapshot(q, (snapshot) => {
                messagesContainer.innerHTML = ''; // مسح الرسائل القديمة عند كل تحديث
                
                if (snapshot.empty) {
                    messagesContainer.innerHTML = '<div class="text-center text-gray-400 mt-10 text-sm">ابدأ المحادثة الآن!</div>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    const isMe = msg.sender === currentUser;
                    const date = msg.timestamp ? new Date(msg.timestamp) : new Date();
                    const timeString = date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

                    const msgDiv = document.createElement('div');
                    msgDiv.className = `flex flex-col w-full ${isMe ? 'items-start' : 'items-end'}`;
                    
                    msgDiv.innerHTML = `
                        <span class="text-[10px] text-gray-400 mb-1 mx-2 font-medium">${msg.sender}</span>
                        <div class="max-w-[85%] px-4 py-2.5 text-[15px] shadow-sm ${
                            isMe 
                            ? 'bg-blue-600 text-white rounded-2xl rounded-tr-sm' 
                            : 'bg-white border border-gray-100 text-gray-800 rounded-2xl rounded-tl-sm'
                        }">
                            <p class="break-words leading-relaxed">${escapeHTML(msg.text)}</p>
                        </div>
                        <span class="text-[10px] text-gray-400 mt-1 mx-2">${timeString}</span>
                    `;
                    messagesContainer.appendChild(msgDiv);
                });
                
                // التمرير التلقائي لأسفل
                scrollToBottom();
            });
        }

        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            // تفريغ الحقل فوراً لتحسين تجربة المستخدم
            messageInput.value = '';
            sendBtn.disabled = true;
            emojiPanel.classList.add('hidden');

            try {
                // إرسال الرسالة إلى Firebase
                await addDoc(messagesRef, {
                    text: text,
                    sender: currentUser,
                    timestamp: Date.now()
                });
            } catch (error) {
                console.error("خطأ في الإرسال:", error);
                alert("حدث خطأ أثناء إرسال الرسالة");
            }
        });

        // =========================================================================
        // 7. تحسينات واجهة المستخدم (إيموجي، تمرير، إدخال)
        // =========================================================================
        
        // تفعيل زر الإرسال عند الكتابة
        messageInput.addEventListener('input', () => {
            sendBtn.disabled = messageInput.value.trim().length === 0;
        });

        // بناء لوحة الإيموجي
        EMOJIS.forEach(emoji => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'text-2xl hover:bg-gray-100 p-2 rounded-xl transition-colors text-center';
            btn.textContent = emoji;
            btn.onclick = () => {
                messageInput.value += emoji;
                sendBtn.disabled = false;
                messageInput.focus();
            };
            emojiGrid.appendChild(btn);
        });

        // إظهار/إخفاء الإيموجي
        emojiBtn.addEventListener('click', () => {
            emojiPanel.classList.toggle('hidden');
        });

        // التمرير لأسفل
        function scrollToBottom() {
            messagesContainer.scrollTo({
                top: messagesContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        // حماية بسيطة ضد ثغرات XSS
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }
    </script>
</body>
</html>
